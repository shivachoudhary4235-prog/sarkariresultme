    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // In sandboxed environments or with polyfills that reassign window.fetch,
      // provide both getter and setter so reassignments succeed without error.
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(newFetch) {
                currentFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(newFetch) {
                    currentFetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }
        } catch (e) {}

        // Global safeguard against any remaining getter errors
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('only a getter') !== -1) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            return true;
          }
        });
      })();
    </script>
